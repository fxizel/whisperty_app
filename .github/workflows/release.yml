name: Release

# Release reproductible sur tag X.Y.Z (sans préfixe « v », comme les tags existants) :
# cohérence version.py / CHANGELOG / tag vérifiée, tests, build de déploiement en
# variante -NoModel (installeur « léger » ; le bundling du modèle ~1,5 Go reste un
# build local via scripts\build.ps1), compilation Inno Setup, puis release GitHub en
# BROUILLON avec l'installeur en pièce jointe (publication manuelle après relecture).
# Signature Authenticode : non tentée ici (certificat sur le poste de build, cf.
# installer/README.md) — l'artefact CI est non signé et la note de release le précise.

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  release:
    name: Build + release (${{ github.ref_name }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Vérifier la cohérence version.py / CHANGELOG / tag
        shell: pwsh
        run: |
          $v = (python -c "from whisperty.version import __version__; print(__version__)").Trim()
          if ($v -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} != version.py ($v) : alignez whisperty/version.py avant de tagger."
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern ("## \[" + [regex]::Escape($v) + "\]") -Quiet)) {
            throw "CHANGELOG.md ne contient pas de section ## [$v] : documentez la version avant de tagger."
          }

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Build de déploiement (-NoModel)
        shell: pwsh
        run: .\scripts\build.ps1 -NoModel

      - name: Compiler l'installeur (Inno Setup)
        shell: pwsh
        run: .\scripts\make_installer.ps1

      - name: Créer la release (brouillon) avec l'installeur
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist\installer\*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "Aucun installeur produit dans dist\installer." }
          gh release create "${{ github.ref_name }}" $setup.FullName `
            --draft `
            --title "Whisperty ${{ github.ref_name }}" `
            --notes "Installeur Windows en variante SANS modèle (téléchargement du modèle proposé au premier lancement — seule exception réseau). Détails dans CHANGELOG.md. Artefact CI non signé : pour un installeur signé et/ou avec modèle bundlé (100 % hors-ligne), builder en local via scripts\build.ps1 puis scripts\make_installer.ps1 -Sign."
