# Whisperty — configuration utilisateur.
# Modifiez ce fichier puis relancez l'application.

audio:
  device: null            # null = micro par défaut ; sinon index (voir logs) ou nom
  samplerate: 16000       # 16 kHz imposé (exigence Whisper) — toute autre valeur
                          # est ramenée à 16000 avec un avertissement
  vad_threshold: 0.01     # seuil RMS du VAD simple (silence si niveau < seuil)
  silence_duration: 1.5   # secondes de silence avant arrêt auto (mode toggle)
  max_duration: 60        # garde-fou : durée max d'un enregistrement (s)
  sound_feedback: true    # bips brefs au démarrage/arrêt de la dictée (100 % local,
                          # winsound) — false pour un fonctionnement silencieux

transcription:
  model: medium           # base | small | medium | large-v3  (medium = bon compromis
                          # précision/vitesse sur CPU pour le français technique)
  language: fr            # langue forcée (fr) ; null = détection automatique
  device: cuda # cpu | cuda
  compute_type: int8      # int8 (CPU) | float16 (CUDA) | int8_float16
  beam_size: 5
  local_files_only: true  # 100 % hors-ligne (défaut). Passer à false UNE fois pour
                          # télécharger un modèle absent, puis remettre à true.
  initial_prompt: "Contexte technique : énergie, réseau de distribution, IT."

hotkey:
  # mode : toggle = un appui démarre / un second appui (ou un silence) arrête.
  #        push_to_talk = maintenir la combinaison en parlant, relâcher pour transcrire.
  mode: toggle            # toggle | push_to_talk

  # combo : format pynput. Modificateurs entre chevrons, reliés par +, puis une touche.
  #   Modificateurs : <ctrl> <alt> <shift> <cmd>
  #   Touche finale : <space>, <enter>, <f9>… ou une lettre simple (a, d, …)
  #   Exemples valides : "<ctrl>+<alt>+<space>"  ·  "<ctrl>+<alt>+d"  ·  "<ctrl>+<shift>+<f9>"
  #   À éviter : Win+Space (réservé par Windows). Combo invalide => repli automatique
  #   sur <ctrl>+<alt>+<space> (un avertissement est journalisé).
  combo: "<ctrl>+<alt>+<space>"

  # double_tap_key : si défini, REMPLACE `combo` par un double-appui rapide sur cette
  #   touche (ex: "ctrl", "alt", "shift"). null = désactivé (on utilise `combo`).
  double_tap_key: null

output:
  method: paste           # paste (presse-papiers + Ctrl+V, robuste FR) | type (frappe)
  restore_clipboard: true # restaurer le contenu du presse-papiers après collage
  restore_delay: 0.3      # délai (s) avant restauration : laisse l'app cible coller
                          # (augmenter sur machine lente/RDP si l'ancien texte revient)
  type_delay: 0.005       # délai entre frappes (méthode "type")

dictionary:
  enabled: true
  path: dictionary.txt    # mots biaisés (hotwords) + corrections "mauvais => bon"

logging:
  level: INFO             # DEBUG | INFO | WARNING | ERROR
  path: logs/whisperty.log

# --- V2 -----------------------------------------------------------------------

gui:
  # Interface fenêtre (tableau de bord, configuration, historique) rendue via Edge
  # WebView2 (préinstallé sur Windows 10/11). 100 % local : aucun asset distant.
  # true (défaut) = ouvre la fenêtre au démarrage, le tray reste un compagnon actif.
  # false = mode zone de notification seule (équivaut à l'option --no-gui).
  # Repli automatique sur le tray seul si pywebview/WebView2 est indisponible.
  enabled: true

history:
  enabled: true           # archive chaque transcription dans une base SQLite locale
  path: whisperty.db      # fichier de la base (à côté de config.yaml par défaut)
  max_entries: 200        # nb max de transcriptions conservées (purge automatique)
  max_age_days: 0         # rétention temporelle (RGPD) : purge les transcriptions
                          # plus vieilles que N jours ; 0 = illimité (défaut)

ai:
  # Raffinage optionnel par un LLM 100 % LOCAL (reponctuation, casse, fautes).
  # CONFIDENTIALITÉ : seuls les endpoints locaux (localhost/127.0.0.1) sont acceptés ;
  # tout autre hôte est refusé. Désactivé par défaut.
  enabled: true
  # Endpoint compatible OpenAI d'un serveur local : Ollama (11434), LM Studio (1234),
  # llama.cpp server… Exemple Ollama : http://localhost:11434/v1/chat/completions
  endpoint: "http://localhost:1234/v1/chat/completions"
  model: google/gemma-4-e4b # nom du modèle servi localement
  prompt: >-
    Tu corriges la ponctuation, la casse et les fautes évidentes d'un texte dicté
    en français. Ne reformule pas, n'ajoute rien, ne réponds que par le texte corrigé.
  timeout: 30             # secondes ; en cas d'échec, le texte brut est conservé

profiles:
  # Profils de contexte appliqués selon l'application active au DÉMARRAGE de la dictée.
  # 'match' = sous-chaînes (insensibles à la casse) du nom de l'exécutable (ex. "code.exe").
  # Le premier profil correspondant gagne ; sinon le contexte par défaut s'applique.
  enabled: false
  definitions:
    - name: code
      match: ["code.exe", "devenv.exe", "windowsterminal.exe"]
      initial_prompt: "Contexte : code source, anglicismes techniques, noms de variables et de fonctions."
      # language: fr        # surcharge optionnelle de la langue
      hotwords: ["commit", "merge", "pull request", "refactor"]
      # corrections: { "git ube": "GitHub" }   # corrections inline
      # dictionary: code_dico.txt              # ou un dictionnaire propre au profil
    - name: mail
      match: ["outlook.exe", "thunderbird.exe", "hxoutlook.exe"]
      initial_prompt: "Contexte : courriel professionnel, formules de politesse, noms propres."

live:
  # Transcription live d'une SORTIE audio (loopback) — ex. suivre une confcall Teams
  # sans importer de fichier. Se lance depuis le menu tray ("Transcription live").
  # Le transcript s'écrit au fil de l'eau dans transcript_dir/live_<horodatage>.txt
  # et est copié dans le presse-papiers + historisé à l'arrêt. 100 % local.
  device: null            # null = sortie par défaut ; sinon index (voir menu) ou nom (sous-chaîne)
  block_duration: 0.5     # granularité de capture (s) ; ~latence d'arrêt
  max_segment: 20         # durée max d'un segment avant transcription forcée (s)
  silence_duration: 0.8   # silence (s) marquant la fin d'un segment (frontière de phrase)
  vad_threshold: 0.008    # seuil RMS de détection de parole
  transcript_dir: transcriptions   # dossier des transcripts live

conference:
  # Mode RÉUNION : capture SIMULTANÉE du micro (ma voix) ET d'une sortie système
  # (loopback = interlocuteurs distants, ex. Teams/Meet/Zoom). Itération 1 : les deux
  # sources sont MIXÉES en une transcription continue (sans étiquette de locuteur).
  # Enregistrement long, démarré/arrêté manuellement via le menu tray. NE PAS injecter :
  # le texte est exporté (transcript horodaté) + historisé. 100 % local.
  # Pensez au CONSENTEMENT des participants. Si une source manque, l'autre est utilisée seule.
  enabled: true
  system_device: null     # sortie à capturer (null = défaut ; index/nom comme 'live')
  mic_device: null        # micro (null = défaut ; index/nom)
  block_duration: 0.5
  max_segment: 20
  silence_duration: 0.8
  vad_threshold: 0.008
  export_dir: transcriptions   # dossier des transcripts de réunion
  export_format: txt           # txt | md
  # Distinction des locuteurs PAR SOURCE (itération 2), sans mixage : le micro et la
  # sortie sont transcrits séparément puis entrelacés chronologiquement. 100 % local,
  # déterministe (pas de diarisation par modèle). false = itération 1 (mixage en une voix).
  distinguish_speakers: true
  mic_label: "Moi"
  system_label: "Interlocuteurs"
  # Diarisation des locuteurs INDIVIDUELS (UC-18) — extension opt-in de la distinction
  # par source ci-dessus. enabled: true => au lieu de « Moi » / « Interlocuteurs », chaque
  # segment porte une étiquette de voix (« Locuteur 1 », « Locuteur 2 », …), entrelacée
  # chronologiquement. 100 % LOCAL : empreinte vocale calculée sur la machine (statistiques
  # MFCC), aucun modèle à télécharger, aucun réseau. Distinction PAR SOURCE : plusieurs
  # personnes au micro et plusieurs participants distants sont séparés. Sans effet si
  # distinguish_speakers: false (mixage). Renommage des locuteurs depuis la fenêtre.
  speaker_diarization:
    enabled: true # opt-in (défaut : distinction par source « Moi »/« Interlocuteurs »)
    max_speakers: 6            # borne du nombre de locuteurs détectés PAR source
    label_prefix: "Locuteur"   # préfixe des étiquettes automatiques
    similarity_threshold: 0.75 # cosinus ≥ seuil => même locuteur (baisser si sur-segmenté)
    min_segment: 1.0           # segments plus courts que N s => non diarisés (repli source)

notes:
  # Notes en session — modes Live continu et Conférence uniquement. Saisie dans la
  # fenêtre (champ sous la transcription en direct, Entrée pour valider), action
  # « Noter » sur un segment du flux (citation), ou « signet » horodaté posé par un
  # raccourci global (fonctionne même sans focus sur la fenêtre). Les notes sont
  # entrelacées chronologiquement dans le transcript (préfixe [Note] / « Note : »)
  # et récapitulées en fin de fichier. 100 % local, comme le reste.
  # bookmark_hotkey : format pynput (cf. hotkey.combo). DOIT différer du raccourci
  # de dictée ; éviter Win+Space. "" (vide) = signet désactivé (la saisie dans la
  # fenêtre reste disponible). Raccourci invalide => signet désactivé (journalisé).
  bookmark_hotkey: "<ctrl>+<alt>+n"

summary:
  # Résumé de fin de session (modes Live continu et Conférence) par le LLM LOCAL.
  # Utilise le serveur de la section ai: (endpoint/model, garde localhost identique)
  # mais s'active INDÉPENDAMMENT de ai.enabled (le raffinage de dictée). À l'arrêt
  # d'une session, le résumé est généré en arrière-plan (l'app est déjà disponible),
  # ajouté au transcript (section "# Résumé"), archivé dans l'historique (source
  # "résumé live"/"résumé réunion") et notifié. LLM absent/muet => pas de résumé,
  # la session reste archivée normalement (jamais bloquant). 100 % local.
  enabled: true
  # prompt : consigne du résumé (français, points concis, décisions et actions).
  prompt: >-
    Tu résumes en français la transcription d'une réunion ou d'une écoute audio.
    Réponds en points concis : sujets abordés, décisions prises, actions à faire
    (avec responsable si mentionné). N'invente rien ; si le texte est trop court
    ou décousu, dis-le simplement.
  timeout: 120            # secondes (un transcript entier est plus long qu'une dictée)
  max_chars: 24000        # tronque l'entrée du LLM au-delà (début + fin conservés)

